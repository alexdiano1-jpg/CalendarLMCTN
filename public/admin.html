<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Hub</title>
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--mut:#78716c;--card:#fff;--bd:#e7e5e4;--ac:#b45309;--ok:#15803d;--bad:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#1c1917;--fg:#fafaf9;--mut:#a8a29e;--card:#292524;--bd:#44403c;--ac:#f59e0b;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:16px}h1{font-size:1.3rem;margin:0 0 12px}
nav{display:flex;gap:6px;margin-bottom:16px}nav button{flex:1}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
button{cursor:pointer}button.on,button.primary{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.row>*{flex:1;min-width:120px}
.mut{color:var(--mut);font-size:.85rem}.pending{border-left:4px solid var(--ac)}
label.chk{display:flex;gap:10px;align-items:center;padding:6px 0;flex:none;min-width:0}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:10px 14px;border-radius:10px;background:var(--fg);color:var(--bg);display:none;text-align:center}
</style></head><body><main>
<h1>Pannello admin</h1>
<nav><button data-t="users" class="on">Utenti</button><button data-t="access">Accessi</button><button data-t="cal">Calendario</button></nav>
<section id="users"></section>
<section id="access" hidden>
  <div class="card"><b>Nuova chat</b><div class="row"><input id="newChat" placeholder="Nome chat"><button id="addChat" class="primary">Crea</button></div></div>
  <div class="card"><div class="row"><select id="rType"><option value="chat">Chat</option><option value="folder">Cartella note</option></select><select id="rId"></select></div>
  <div id="subjects"></div><div class="row"><button id="saveAcc" class="primary">Salva accessi</button></div></div>
</section>
<section id="cal" hidden><div class="card"><b>Pulizia eventi passati</b>
  <p class="mut">Elimina tutti gli eventi di un mese intero già concluso. Le serie ricorrenti vengono saltate.</p>
  <div class="row"><input type="month" id="month"><button id="purge" class="primary">Elimina mese</button></div></div></section>
</main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const h=(t,p={},...k)=>{const e=document.createElement(t);Object.assign(e,p);e.append(...k);return e};
const api=async(path,o={})=>{const r=await fetch('/api'+path,{method:o.method||'GET',headers:{'Content-Type':'application/json'},body:o.body&&JSON.stringify(o.body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j};
let tt;const toast=(m,bad)=>{const t=$('#toast');t.textContent=m;t.style.display='block';t.style.background=bad?'var(--bad)':'var(--fg)';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2500)};
const run=f=>async(...a)=>{try{await f(...a)}catch(e){toast(e.message,true)}};
const ROLES={admin:'Admin',member:'Membro Avanzato',viewer:'Spettatore'},ST={pending:'In attesa',approved:'Approvato',blocked:'Bloccato'};
const sel=(opts,val,cb)=>{const s=h('select');for(const[k,v]of Object.entries(opts))s.append(h('option',{value:k,textContent:v,selected:k===val}));s.onchange=run(()=>cb(s.value));return s};

// tab
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['users','access','cal'].forEach(id=>$('#'+id).hidden=id!==b.dataset.t);
  if(b.dataset.t==='access')loadResources();});

// utenti
let USERS=[];
const loadUsers=run(async()=>{
  USERS=await api('/admin/users');const box=$('#users');box.replaceChildren();
  USERS.sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1));
  for(const u of USERS){
    const c=h('div',{className:'card'+(u.status==='pending'?' pending':'')},h('b',{textContent:u.name||u.email}),h('div',{className:'mut',textContent:u.email}));
    const patch=run(async body=>{await api('/admin/users/'+u.id,{method:'PATCH',body});toast('Salvato');loadUsers()});
    c.append(h('div',{className:'row'},sel(ROLES,u.role,v=>patch({role:v})),sel(ST,u.status,v=>patch({status:v}))));
    if(u.status==='pending')c.append(h('div',{className:'row'},h('button',{className:'primary',textContent:'Approva',onclick:()=>patch({status:'approved'})})));
    box.append(c);}
});

// accessi
const loadResources=run(async()=>{
  const t=$('#rType').value;
  const list=t==='chat'?await api('/chats'):(await api('/notes/folders')).map(f=>({id:f.id,name:f.name}));
  const s=$('#rId');s.replaceChildren(...list.map(r=>h('option',{value:r.id,textContent:r.name})));
  if(!list.length)s.append(h('option',{textContent:'(nessuna risorsa)',value:''}));
  await loadSubjects();
});
const loadSubjects=run(async()=>{
  const box=$('#subjects');box.replaceChildren();const id=$('#rId').value;if(!id)return;
  if(!USERS.length)USERS=await api('/admin/users');
  const cur=await api(`/admin/access?resourceType=${$('#rType').value}&resourceId=${encodeURIComponent(id)}`);
  const has=(t,i)=>cur.some(c=>c.subject_type===t&&c.subject_id===String(i));
  const add=(type,sid,label)=>{const cb=h('input',{type:'checkbox',checked:has(type,sid)});cb.dataset.type=type;cb.dataset.id=sid;
    box.append(h('label',{className:'chk'},cb,label));};
  box.append(h('div',{className:'mut',textContent:'Interi ruoli'}));
  add('role','member','Tutti i Membri Avanzati');add('role','viewer','Tutti gli Spettatori');
  box.append(h('div',{className:'mut',textContent:'Singoli utenti'}));
  USERS.filter(u=>u.status==='approved'&&u.role!=='admin').forEach(u=>add('user',u.id,u.name||u.email));
});
$('#rType').onchange=loadResources;$('#rId').onchange=loadSubjects;
$('#addChat').onclick=run(async()=>{const name=$('#newChat').value.trim();if(!name)return;
  await api('/admin/chats',{method:'POST',body:{name}});$('#newChat').value='';toast('Chat creata');$('#rType').value='chat';loadResources()});
$('#saveAcc').onclick=run(async()=>{
  const subjects=[...document.querySelectorAll('#subjects input:checked')].map(i=>({type:i.dataset.type,id:i.dataset.id}));
  await api('/admin/access',{method:'PUT',body:{resourceType:$('#rType').value,resourceId:$('#rId').value,subjects}});toast('Accessi salvati')});

// calendario
(()=>{const d=new Date();d.setMonth(d.getMonth()-1);$('#month').max=d.toISOString().slice(0,7);$('#month').value=$('#month').max})();
$('#purge').onclick=run(async()=>{const[y,m]=$('#month').value.split('-').map(Number);if(!y)return;
  if(!confirm(`Eliminare TUTTI gli eventi di ${$('#month').value}? L'operazione è irreversibile.`))return;
  const r=await api('/admin/calendar/purge',{method:'POST',body:{year:y,month:m}});toast(`${r.deleted} eventi eliminati`)});

(async()=>{const me=await(await fetch('/api/me')).json();if(!me||me.role!=='admin')return location.href='/';loadUsers()})();
</script></body></html>
